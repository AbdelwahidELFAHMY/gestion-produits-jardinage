# Application
spring.application.name=gestion-produits-jardinage

# Profil actif
spring.profiles.active=dev

# Configuration metier
app.business.name = Jardinage Pro
app.business.contact-email = abdelwahidfhmy@gmail.com
app.business.phone =0123456789
app.business.address =123 Rue des Jardins, 75000 Paris

#Configuration stock
app.stock.low-stock-threshold=10
app.stock.reorder-delay-days =7
app.stock.auto-reorder=false

# Configuration prix
app.pricing.default-tax-rate=20.0
app.pricing.max-discount-rate=30.0
app.pricing.currency=EUR


#Internationalisation
spring.messages.basename = i18n/messages
spring.messages.encoding = UTF-8
spring.messages.fallback-to-system-locale = false

# Logging
logging.level.root=INFO
logging.level.fr.univjardinage.jardinage=DEBUG
logging.pattern.console =%d{yyyy -MM-dd HH:mm:ss} - %msg%n

# H2 Database
spring.datasource.url=jdbc:h2:mem:jardinagedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Demo data
app.demo.data.enabled=true



# H2 Test Database
spring.datasource.url = jdbc:h2:mem:testdb
spring.datasource.driverClassName = org.h2.Driver
spring.datasource.username = sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto = create-drop
spring.jpa.show-sql = true
spring.jpa.properties.hibernate.format_sql = true

# Logging
logging.level.org.hibernate.SQL = DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder = TRACE

# Configuration API fournisseur
supplier.api.base-url=https://api.fournisseur-jardinage.com/v1
supplier.api.key=${SUPPLIER_API_KEY:default-key}

supplier.api.timeout.connect=5000
supplier.api.timeout.read=10000

# Retry configuration
supplier.api.retry.max-attempts=3
supplier.api.retry.delay=1000